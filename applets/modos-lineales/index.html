<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modos de la hidrodinámica linealizada</title>
<link rel="stylesheet" href="../../assets/style.css">
<link rel="icon" href="data:,">
<style>.canvases.stack { grid-template-columns: 1fr; } .canvases.stack canvas { aspect-ratio: 3 / 1; } .toggles button[aria-pressed="true"] { border-color: var(--accent); font-weight: 600; }</style>
</head>
<body>
<header class="site"></header>
<main>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="sim" aria-selected="true" data-i18n="tab.sim">Simulación</button>
    <button type="button" role="tab" data-tab="theory" aria-selected="false" data-i18n="tab.theory">Teoría y notas</button>
  </div>
  <section id="sim" class="tab-panel">
    <div class="params" id="params"></div>
    <div class="controls" id="toggles"></div>
    <div id="loopctl"></div>
    <div class="canvases stack">
      <figure id="fig-rho"><canvas id="rho" class="plot"></canvas><figcaption data-i18n="modos.cap.rho"></figcaption></figure>
      <figure id="fig-u"><canvas id="u" class="plot"></canvas><figcaption data-i18n="modos.cap.u"></figcaption></figure>
      <figure id="fig-T"><canvas id="T" class="plot"></canvas><figcaption data-i18n="modos.cap.T"></figcaption></figure>
    </div>
    <div class="readout" id="readout"></div>
    <p class="hint" data-i18n="modos.hint"></p>
  </section>
  <section id="theory" class="tab-panel" hidden><div class="theory"></div></section>
  <footer class="site"></footer>
</main>
<script type="module" src="./view.js"></script>
</body>
</html>
